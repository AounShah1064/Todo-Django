{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16">
    <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold text-gray-900">Welcome Back</h2>
            <p class="text-gray-500 mt-2 text-sm">Please enter your details to sign in</p>
        </div>

        <form method="post" class="space-y-4 login-form">
            {% csrf_token %}
            
            <!-- This container helps style the default Django form output -->
            <div class="django-form-container">
                {{ form.as_p }}
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition-all shadow-lg shadow-blue-200">
                Sign In
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-gray-100 text-center">
            <p class="text-gray-600 text-sm">
                Don't have an account? 
                <a href="{% url 'register' %}" class="text-blue-600 font-bold hover:underline ml-1">Register here</a>
            </p>
        </div>
    </div>
</div>

<style>
    /* Styling the paragraphs and inputs rendered by form.as_p */
    .django-form-container p {
        margin-bottom: 1rem;
    }
    .django-form-container label {
        display: block;
        font-size: 0.875rem;
        font-weight: 600;
        color: #374151;
        margin-bottom: 0.25rem;
    }
    .django-form-container input {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #d1d5db;
        border-radius: 0.5rem;
        outline: none;
    }
    .django-form-container input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
</style>
{% endblock %}
