{% extends 'base.html' %}

{% block title %}Confirm Delete{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12 bg-white p-8 rounded-xl shadow-lg border border-gray-100 text-center">
    <div class="text-red-500 mb-4">
        <svg class="w-16 h-16 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
    </div>
    <h2 class="text-2xl font-bold text-gray-900 mb-2">Are you sure?</h2>
    <p class="text-gray-600 mb-8">You are about to delete <span class="font-bold">"{{ task.title }}"</span>. This cannot be undone.</p>
    
    <form method="POST" class="flex flex-col gap-3">
        {% csrf_token %}
        <button type="submit" class="w-full bg-red-600 text-white py-3 rounded-lg font-bold hover:bg-red-700 transition">Delete Permanently</button>
        <a href="/" class="w-full bg-gray-100 text-gray-700 py-3 rounded-lg font-bold hover:bg-gray-200 transition">Cancel</a>
    </form>
</div>
{% endblock %}
